<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="site">
    {{ partial "header.html" . }}
    <main id="main" tabindex="-1" data-pagefind-body>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  {{ partial "search.html" . }}
  {{ $js := resources.Get "js/tprf.js" | resources.Minify | resources.Fingerprint "sha512" }}
  <script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
</body>
</html>
