---
name: Link check

# Outside sites break links without a commit here, so the weekly run matters
# most: it opens (or updates) an issue listing what broke. PRs that touch site
# sources fail on broken links instead.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "data/**"
      - "config/**"
      - "hugo.toml"
      - "lychee.toml"
      - ".github/workflows/linkcheck.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "linkcheck-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
      LINKCHECK_DIR: ${{ github.workspace }}/.linkcheck
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Hugo
        # Same build as `make linkcheck`; see lychee.toml for why --baseURL /.
        run: hugo --gc --minify --baseURL / --destination "$LINKCHECK_DIR"
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir ${{ env.LINKCHECK_DIR }} ${{ env.LINKCHECK_DIR }}
          # Scheduled runs report through an issue rather than a red X.
          fail: ${{ github.event_name != 'schedule' }}
      - name: Find open broken-links issue
        id: issue
        if: ${{ github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Broken links report"' --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Open or update broken-links issue
        if: ${{ github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0 }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.issue.outputs.number }}
